<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Копилка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:#F3F5F7;color:#12202B;font-family:'Manrope',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.scroll{height:100%;overflow-y:auto;padding:24px 16px 120px}
.h1{font-weight:800;font-size:26px;margin:4px 0 12px}
.card{background:#fff;border:1px solid #E3E8EC;border-radius:20px;padding:18px;margin-bottom:12px}
.pigbox{display:flex;justify-content:center;margin:-4px 0 4px}
.bar{height:10px;border-radius:5px;background:#E3E8EC;overflow:hidden}
.bar i{display:block;height:10px;width:48%;border-radius:5px;background:linear-gradient(90deg,#F28AB0,#F2B33D)}
.btn{display:block;text-align:center;background:#0E7C7B;color:#fff;border-radius:16px;padding:15px;font-weight:800;font-size:16px}
.acc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E3E8EC}
.acc:last-child{border-bottom:0}
.mini{width:42px;height:42px;border-radius:14px;background:#FDE4EE;display:flex;align-items:center;justify-content:center}
.mini.alt{background:#E1F2F1}
.tabs{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #E3E8EC;display:flex;align-items:flex-start;padding:8px 8px 14px}
.t{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#6B7A88;font-size:11px;font-weight:700}
.t.on{color:#0E7C7B}
.plus{flex:none;margin:-18px 6px 0;width:52px;height:52px;border-radius:26px;background:#0E7C7B;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(14,124,123,.35)}
@keyframes drop{0%{transform:translateY(-62px);opacity:0}12%{opacity:1}58%{transform:translateY(34px);opacity:1}68%{transform:translateY(38px);opacity:0}100%{transform:translateY(38px);opacity:0}}
@keyframes hop{0%,56%,100%{transform:translateY(0) scale(1,1)}64%{transform:translateY(5px) scale(1.03,.96)}74%{transform:translateY(-4px) scale(.99,1.02)}84%{transform:translateY(0) scale(1,1)}}
.coin{animation:drop 2.6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.pig{animation:hop 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
</style>
</head>
<body>
<div class="app">
  <div class="scroll">
    <div class="h1">Накопления</div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-weight:800;font-size:18px">Отпуск</div>
        <div style="font-size:12px;font-weight:700;color:#6B7A88">цель к 1 мая</div>
      </div>
      <div class="pigbox">
        <svg width="260" height="190" viewBox="0 0 240 200" role="img" aria-label="Копилка-свинья заполнена на 48%">
          <ellipse cx="120" cy="186" rx="82" ry="7" fill="rgba(18,32,43,.08)"/>
          <g class="pig">
            <rect x="66" y="136" width="24" height="40" rx="9" fill="#E67FA6"/>
            <rect x="150" y="136" width="24" height="40" rx="9" fill="#E67FA6"/>
            <path d="M38 96 C16 92 14 120 34 118" fill="none" stroke="#E67FA6" stroke-width="6" stroke-linecap="round"/>
            <ellipse cx="116" cy="104" rx="86" ry="64" fill="#F7A9C6"/>
            <clipPath id="belly"><ellipse cx="116" cy="104" rx="86" ry="64"/></clipPath>
            <rect x="30" y="104" width="172" height="64" fill="#F2B33D" opacity=".4" clip-path="url(#belly)"/>
            <path d="M84 56 L96 24 L116 52 Z" fill="#E67FA6"/>
            <path d="M126 52 L146 28 L156 62 Z" fill="#E67FA6"/>
            <ellipse cx="196" cy="112" rx="26" ry="22" fill="#F28AB0"/>
            <ellipse cx="190" cy="112" rx="4" ry="6" fill="#D96A93"/>
            <ellipse cx="204" cy="112" rx="4" ry="6" fill="#D96A93"/>
            <circle cx="166" cy="86" r="5.5" fill="#12202B"/>
            <rect x="94" y="44" width="46" height="7" rx="3.5" fill="#D96A93"/>
          </g>
          <g class="coin">
            <circle cx="117" cy="40" r="14" fill="#F2B33D" stroke="#C98A1E" stroke-width="3"/>
            <path d="M111 40h12M117 34v12" stroke="#C98A1E" stroke-width="2.6" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div style="text-align:center">
        <div style="font-weight:800;font-size:30px">1 200 ₾ <span style="font-size:15px;color:#6B7A88;font-weight:700">из 2 500 ₾</span></div>
        <div class="bar" style="margin:12px 0 8px"><i></i></div>
        <div style="font-size:13px;color:#6B7A88;font-weight:600">Осталось 1 300 ₾ · при 300 ₾ в месяц хватит на 5 месяцев</div>
      </div>
      <div class="btn" style="margin-top:16px">Пополнить копилку</div>
    </div>

    <div class="card" style="padding:6px 18px">
      <div class="acc">
        <div class="mini"><svg width="26" height="22" viewBox="0 0 240 200" aria-hidden="true"><ellipse cx="116" cy="104" rx="86" ry="64" fill="#F7A9C6"/><ellipse cx="196" cy="112" rx="26" ry="22" fill="#F28AB0"/></svg></div>
        <div style="flex:1"><div style="font-weight:800">Отпуск</div><div style="font-size:12px;color:#6B7A88">копилка · GEL</div></div>
        <div style="font-weight:800">1 200,00 ₾</div>
      </div>
      <div class="acc">
        <div class="mini"><svg width="26" height="22" viewBox="0 0 240 200" aria-hidden="true"><ellipse cx="116" cy="104" rx="86" ry="64" fill="#F7A9C6"/><ellipse cx="196" cy="112" rx="26" ry="22" fill="#F28AB0"/></svg></div>
        <div style="flex:1"><div style="font-weight:800">Подушка безопасности</div><div style="font-size:12px;color:#6B7A88">копилка · USDT</div></div>
        <div style="font-weight:800">600,00 USDT</div>
      </div>
      <div class="acc">
        <div class="mini alt"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg></div>
        <div style="flex:1"><div style="font-weight:800">Депозит TBC</div><div style="font-size:12px;color:#6B7A88">накопительный · GEL</div></div>
        <div style="font-weight:800">5 000,00 ₾</div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <div class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Операции</div>
    <div class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h7v7H4zM13 5h7v7h-7zM4 14h7v6H4zM13 14h7v6h-7z"/></svg>Категории</div>
    <div class="plus"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-9M12 20V5M19 20v-6"/></svg>Отчёты</div>
    <div class="t on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a3 3 0 013-3h12a3 3 0 013 3v10a3 3 0 01-3 3H6a3 3 0 01-3-3zM3 10h18M7 15h4"/></svg>Счета</div>
  </nav>
</div>
</body>
</html>
