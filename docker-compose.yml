# moneykeeper-webapp подключён к общей сети tracker-bot_default, через неё Caddy tracker-bot
# отдаёт наружу HTTPS. Обычные имена (app, webapp) в этой сети уже заняты другим проектом,
# поэтому у сервисов в ней префикс moneykeeper-. db и migrate живут только в сети проекта.
name: moneykeeper

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moneykeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: moneykeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneykeeper -d moneykeeper"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://moneykeeper:${POSTGRES_PASSWORD}@db:5432/moneykeeper?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  moneykeeper-app:
    build: .
    container_name: moneykeeper-app
    env_file: .env
    environment:
      DATABASE_URL: postgres://moneykeeper:${POSTGRES_PASSWORD}@db:5432/moneykeeper?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  moneykeeper-webapp:
    build: ./webapp
    container_name: moneykeeper-webapp
    depends_on:
      - moneykeeper-app
    restart: unless-stopped
    networks:
      - default
      - edge

volumes:
  pgdata:

networks:
  edge:
    name: tracker-bot_default
    external: true
